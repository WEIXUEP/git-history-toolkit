<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git History Toolkit · 清理确认</title>
<style nonce="__NONCE__">
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#202923;background:#f5f7f6;font-size:14px;letter-spacing:0}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d7dfda;padding:22px 28px}h1{font-size:22px;margin:0 0 8px}#repo{overflow-wrap:anywhere;color:#40554a}main{padding:20px 28px 190px;max-width:1800px;margin:auto}.summary{display:flex;flex-wrap:wrap;gap:24px;padding-bottom:18px}.summary strong{font-size:21px;display:block}.muted{color:#637269;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}label{display:flex;align-items:center;gap:6px}input,select,button{font:inherit;border:1px solid #b8c6bd;background:white;border-radius:4px;padding:9px 11px;color:inherit}input[type=checkbox]{width:17px;height:17px;accent-color:#17714c;flex-shrink:0}button{cursor:pointer;min-height:38px}button:disabled{opacity:.45;cursor:default}button.primary{background:#166747;color:#fff;border-color:#166747}button.danger{background:#a72c30;color:#fff;border-color:#a72c30}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #84b9d5;outline-offset:2px}#search{width:260px;max-width:100%}.table-wrap{overflow:auto;border:1px solid #d7dfda;background:#fff}table{width:100%;border-collapse:collapse;min-width:1040px;table-layout:fixed}th{text-align:left;font-weight:600;font-size:12px;background:#edf2ee;position:sticky;top:0}td,th{padding:12px 10px;border-bottom:1px solid #e2e8e4;vertical-align:top}td{line-height:1.5}.path{overflow-wrap:anywhere;font-weight:600}.sha{font-family:Consolas,monospace;font-size:11px;color:#68776d;overflow-wrap:anywhere}.size{text-align:right;font-variant-numeric:tabular-nums}.suffix{color:#5d4679}.state{font-size:12px;font-weight:600;color:#236745}.locked{color:#7b6441}.time{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}details{font-size:12px;margin-top:5px}summary{cursor:pointer;color:#486f91}.detail{overflow-wrap:anywhere;white-space:pre-wrap;padding-top:6px}footer{position:fixed;bottom:0;background:#fff;border-top:1px solid #c9d5cd;box-shadow:0 -3px 16px #20352a0a;width:100%;padding:14px 28px;display:flex;gap:18px;align-items:center;justify-content:space-between;z-index:2}.selection{min-width:190px}.selection strong{font-size:18px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}#token{width:140px}#message{color:#a72c30;min-height:20px;margin-top:8px;overflow-wrap:anywhere}#backup{overflow-wrap:anywhere;max-width:700px}#empty{text-align:center;padding:36px;color:#637269}#notice{padding:10px 0 16px;color:#6e4a2e;line-height:1.6}.badge{font-size:12px;padding:3px 6px;background:#eef3ef;border-radius:3px}#finish{padding:30px 0;font-size:18px;color:#176946;display:none}@media(max-width:720px){header{padding:16px}main{padding:16px 16px 280px}footer{padding:12px 16px;display:block}.actions{justify-content:flex-start;margin-top:10px}.summary{gap:16px}.toolbar{gap:8px}h1{font-size:20px}#search{width:100%}.time{white-space:normal}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
col:nth-child(1){width:4%}col:nth-child(2){width:30%}col:nth-child(3){width:8%}col:nth-child(4){width:10%}col:nth-child(5),col:nth-child(6){width:15%}col:nth-child(7){width:18%}
@media(max-width:720px){table{min-width:0;display:block}colgroup{display:none}thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}tbody{display:block}tr{display:grid;grid-template-columns:28px minmax(0,1fr);padding:12px 6px;border-bottom:1px solid #d7dfda}td{display:block;grid-column:2;border:0;padding:4px 6px}td:first-child{grid-column:1;grid-row:1/7}td.size{text-align:left}td:nth-child(3)::before{content:'后缀：';color:#637269}td:nth-child(4)::before{content:'文件大小：';color:#637269}td:nth-child(5)::before{content:'历史出现 (UTC)：';color:#637269}td:nth-child(6)::before{content:'引用变化 (UTC)：';color:#637269}.time{overflow-wrap:anywhere}.path{font-size:14px}}
</style></head><body>
<header><h1>Git History Toolkit <span class="badge" id="mode"></span></h1><div id="repo"></div></header>
<main><div class="summary"><div><strong id="total">0</strong><span class="muted">历史对象</span></div><div><strong id="eligible">0</strong><span class="muted">可选清理对象</span></div><div><strong id="totalSize">0</strong><span class="muted">对象原始体积</span></div><div><strong id="threshold"></strong><span class="muted">大小 / 年龄阈值</span></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="搜索历史路径或对象 SHA" aria-label="搜索路径或对象"><select id="suffix" aria-label="文件后缀"></select><select id="status" aria-label="对象状态"></select><select id="sort" aria-label="排序"><option value="size">大小：从大到小</option><option value="date">历史最近出现：从近到远</option><option value="path">路径：字母顺序</option></select><label><input id="only" type="checkbox">仅可选项</label><button id="select">选择当前筛选项</button><button id="clear">清空选择</button></div>
<div id="notice">清理作用于 Git 历史对象及其全部历史路径，不是删除工作区文件。历史出现时间取包含对象的提交时间（UTC）；清理年龄按最近引用变化计算。原始体积不等于实际释放空间。</div>
<div id="finish" role="status"></div><div class="table-wrap"><table><colgroup><col><col><col><col><col><col><col></colgroup><thead><tr><th><span aria-label="选择">选</span></th><th>历史路径 / 对象</th><th>后缀</th><th class="size">文件大小</th><th>历史最近出现 (UTC)</th><th>最近引用变化 (UTC)</th><th>分类 / 原因</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>没有符合筛选条件的对象</div></div></main>
<footer><div class="selection"><strong id="selected">已选 0 项 · 0 B</strong><div class="muted" id="backup"></div></div><div><div class="actions"><label for="token" id="confirmLabel"></label><input id="token" autocomplete="off" spellcheck="false" aria-label="确认文字"><button id="cancel">取消</button><button id="confirm" disabled></button></div><div id="message" role="alert"></div></div></footer>
<script nonce="__NONCE__" id="data" type="application/json">__DATA__</script>
<script nonce="__NONCE__">
'use strict';
const data=JSON.parse(document.getElementById('data').textContent), selected=new Set(), $=id=>document.getElementById(id);
const names={CURRENT:'当前版本',PROTECTED:'已保护',OLD_VERSION:'历史旧版本',DELETED_PATH:'路径已删除',GERRIT_PATCHSET_ONLY:'Gerrit 复核',TOO_NEW:'时间未满足',CANDIDATE:'候选'};
const cleanup=data.mode==='cleanup', word=cleanup?'CLEANUP':'REVIEW';let finished=false;
function bytes(n){let unit=0;const units=['B','KiB','MiB','GiB','TiB'];while(n>=1024&&unit<4){n/=1024;unit++}return `${n.toFixed(unit?2:0)} ${units[unit]}`}
function date(v){return v?new Date(v).toISOString().replace('T',' ').slice(0,19):'未知'}
function text(tag,value,className){const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el}
function filterRows(){const q=$('search').value.toLowerCase();return data.rows.filter(r=>(!q||[r.sha,...r.paths].some(p=>p.toLowerCase().includes(q)))&&(!$('suffix').value||r.suffixes.includes($('suffix').value))&&(!$('status').value||r.status===$('status').value)&&(!$('only').checked||r.eligible)).sort((a,b)=>$('sort').value==='path'?(a.paths[0]||'').localeCompare(b.paths[0]||''):$('sort').value==='date'?(b.last_present?.time||'').localeCompare(a.last_present?.time||''):b.size-a.size)}
function update(){const size=data.rows.filter(r=>selected.has(r.sha)).reduce((n,r)=>n+r.size,0);$('selected').textContent=`已选 ${selected.size} 项 · ${bytes(size)}`;$('confirm').disabled=finished||!selected.size||$('token').value!==word}
function render(){const body=$('rows');body.replaceChildren();const rows=filterRows();$('empty').hidden=!!rows.length;for(const r of rows){const tr=document.createElement('tr'),cell=document.createElement('td'),check=document.createElement('input');check.type='checkbox';check.disabled=!r.eligible||finished;check.checked=selected.has(r.sha);check.setAttribute('aria-label',`选择 ${r.paths[0]||r.sha}`);check.addEventListener('change',()=>{check.checked?selected.add(r.sha):selected.delete(r.sha);update()});cell.append(check);tr.append(cell);const pathCell=document.createElement('td');pathCell.append(text('div',r.paths[0]||'(路径未知)','path'),text('div',r.sha,'sha'));const detail=document.createElement('details');detail.append(text('summary',`${r.paths.length} 个历史路径 · 详情`));detail.append(text('div',[...r.paths,`精确大小：${r.size.toLocaleString()} B`,`最近出现提交：${r.last_present?.commit||'未知'}`,`审计时年龄：${r.age_days??'未知'} 天`,...r.refs].join('\n'),'detail'));pathCell.append(detail);tr.append(pathCell);tr.append(text('td',r.suffixes.join(', '),'suffix'));const sizeCell=text('td',bytes(r.size),'size');sizeCell.title=`${r.size.toLocaleString()} bytes`;tr.append(sizeCell,text('td',date(r.last_present?.time),'time'),text('td',date(r.last_change),'time'));const state=document.createElement('td');state.append(text('div',names[r.status]||r.status,r.eligible?'state':'state locked'),text('div',r.reason,'muted'));tr.append(state);body.append(tr)}update()}
function options(id,first,values){$(id).append(new Option(first,''));for(const [value,label]of values)$(id).append(new Option(label,value))}
const suffixes=[...new Set(data.rows.flatMap(r=>r.suffixes))].sort();options('suffix','全部后缀',suffixes.map(s=>{const rows=data.rows.filter(r=>r.suffixes.includes(s));return[s,`${s} · ${rows.length} 项 · ${bytes(rows.reduce((n,r)=>n+r.size,0))}`]}));options('status','全部状态',[...new Set(data.rows.map(r=>r.status))].map(s=>[s,names[s]||s]));
$('repo').textContent=data.repository;$('mode').textContent=cleanup?'执行前确认':'仅审阅，不执行清理';$('total').textContent=data.rows.length;$('eligible').textContent=data.rows.filter(r=>r.eligible).length;$('totalSize').textContent=bytes(data.rows.reduce((n,r)=>n+r.size,0));$('threshold').textContent=`${data.threshold_mb} MiB / ${data.threshold_days} 天`;$('backup').textContent=cleanup?`备份：${data.backup}`:`审计：${date(data.audit_time)} UTC`;$('confirmLabel').textContent=`输入 ${word}`;$('confirm').textContent=cleanup?'确认清理所选历史对象':'保存所选对象';$('confirm').className=cleanup?'danger':'primary';
for(const id of ['search','suffix','status','sort','only'])$(id).addEventListener('input',render);$('token').addEventListener('input',update);$('clear').addEventListener('click',()=>{selected.clear();render()});$('select').addEventListener('click',()=>{for(const r of filterRows())if(r.eligible)selected.add(r.sha);render()});
async function submit(cancel){$('message').textContent='';$('confirm').disabled=true;$('cancel').disabled=true;try{const response=await fetch(`/decision/${data.token}`,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':data.token},body:JSON.stringify({digest:data.digest,cancel,selected:[...selected],confirmation:$('token').value})});if(!response.ok)throw new Error('确认未被接受，请检查所选对象与确认文字。');finished=true;for(const el of document.querySelectorAll('input,select,button'))el.disabled=true;$('finish').style.display='block';$('finish').textContent=cancel?'已取消，未授权清理。':cleanup?'清理选择已确认。请在终端查看执行结果。':'选择已保存，未执行清理。'}catch(error){$('message').textContent=error.message+' 若服务已超时，请从终端重新发起审阅。';$('cancel').disabled=false;update()}}
$('confirm').addEventListener('click',()=>submit(false));$('cancel').addEventListener('click',()=>submit(true));render();
</script></body></html>
